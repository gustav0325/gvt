name: Deploy HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar site
        run: npm run build

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.HOSTGATOR_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostgator_key
          chmod 600 ~/.ssh/hostgator_key

          eval "$(ssh-agent -s)"

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/askpass.sh

          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          setsid ssh-add ~/.ssh/hostgator_key </dev/null

      - name: Registrar servidor HostGator
        env:
          HOST: ${{ secrets.HOSTGATOR_HOST }}
          PORT: ${{ secrets.HOSTGATOR_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Publicar na HostGator
        env:
          HOST: ${{ secrets.HOSTGATOR_HOST }}
          PORT: ${{ secrets.HOSTGATOR_PORT }}
          USER: ${{ secrets.HOSTGATOR_USER }}
        run: |
          rsync -avz --delete \
            --exclude=".well-known/" \
            --exclude="_backup_site_antigo/" \
            --exclude="cgi-bin/" \
            --exclude="gvt-site.zip" \
            -e "ssh -p $PORT" \
            _site/ \
            "$USER@$HOST:/home2/gvtcor30/public_html/"