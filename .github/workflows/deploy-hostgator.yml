name: Deploy HostGator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar site
        run: npm run build

      - name: Publicar via SFTP na HostGator
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.HOSTGATOR_USER }}
          server: ${{ secrets.HOSTGATOR_HOST }}
          port: ${{ secrets.HOSTGATOR_PORT }}

          ssh_private_key: ${{ secrets.HOSTGATOR_SSH_KEY }}
          ssh_passphrase: ${{ secrets.HOSTGATOR_SSH_PASSPHRASE }}

          local_path: './_site/*'
          remote_path: '/home2/gvtcor30/public_html'

          sftp_only: true
          delete_remote_files: false

          sftpArgs: '-o ConnectTimeout=15'